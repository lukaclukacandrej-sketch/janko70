<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Janko 70 – Pozvánka</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy1:#0a1633;--navy2:#050b1c;--gold:#e8c872;--gold2:#fff1b8;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--navy2);overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif;color:var(--gold);-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:radial-gradient(ellipse at 50% 35%,var(--navy1),var(--navy2) 75%)}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0}
.deco svg{position:absolute;fill:none;stroke:var(--gold);stroke-width:1.6;opacity:.13;stroke-linecap:round;stroke-linejoin:round}
#clef{height:62vh;left:-3vw;top:12vh;animation:sway 14s ease-in-out infinite}
#violin{height:68vh;right:-6vw;bottom:-4vh;transform:rotate(18deg);animation:sway2 16s ease-in-out infinite}
@keyframes sway{50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes sway2{50%{transform:rotate(14deg) translateY(-10px)}}
.staff{position:fixed;left:0;right:0;top:50%;height:90px;transform:translateY(-50%);opacity:.08;z-index:0;pointer-events:none;
 background:repeating-linear-gradient(to bottom,var(--gold) 0 1px,transparent 1px 22px)}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block}
.card{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center;
 padding:calc(env(safe-area-inset-top,0px) + 2vh) 22px calc(120px + env(safe-area-inset-bottom,0px))}
.pre{position:relative;top:2.5vh;font-size:clamp(8px,2.1vw,13px);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;line-height:1.95;width:calc(100vw - 16px);max-width:820px;opacity:.95;margin-bottom:.5em}
.big{position:relative;top:-2vh;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(100px,min(37vw,23.5vh),300px);line-height:1;margin:0;
 background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#b8913a);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 4px 22px rgba(232,200,114,.35))}
.sub{font-size:clamp(15px,min(4.6vw,2.8vh),28px);letter-spacing:.38em;text-transform:uppercase;margin-top:0}
.name{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(38px,min(11vw,8vh),88px);margin:0;color:var(--gold2);text-shadow:0 2px 18px rgba(232,200,114,.4)}
.line{width:min(260px,60vw);height:1px;margin:0 auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.info{font-size:clamp(20px,min(6vw,3.6vh),38px);font-weight:600;line-height:1.5}
.info small{display:block;font-size:.78em;font-weight:400;opacity:.9;letter-spacing:.08em;margin-top:.5em}
.hud{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;font-size:clamp(15px,4vw,19px)}
.hud button{pointer-events:auto;background:rgba(10,22,51,.6);color:var(--gold);border:1px solid var(--gold);border-radius:26px;padding:8px 20px;font:inherit;cursor:pointer}
.addr{font-size:.82em;font-weight:400}
.thanks{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(22px,min(6.4vw,3.6vh),42px);color:var(--gold2);text-shadow:0 2px 18px rgba(232,200,114,.4)}
#msg{opacity:.9;min-height:1.4em;text-align:center;padding:0 16px}
.card .pre,.card .big,.card .sub,.card .name,.card .info,.card .info small,.card .thanks{font-weight:700}
#open{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:22px;
 background:radial-gradient(ellipse at 50% 35%,var(--navy1),var(--navy2) 75%);transition:opacity .7s ease;cursor:pointer}
#open.gone{opacity:0;pointer-events:none}
#open .t{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(40px,12vw,80px);color:var(--gold2);text-shadow:0 2px 18px rgba(232,200,114,.4)}
#open .b{font-weight:700;font-size:clamp(20px,5.4vw,28px);letter-spacing:.08em;color:var(--gold);border:1px solid var(--gold);border-radius:30px;padding:12px 30px;background:rgba(10,22,51,.6);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
</style>
</head>
<body>
<div class="deco">
 <svg id="clef" viewBox="0 0 100 250"><path d="M52 215 L52 40 C52 8 74 4 74 32 C74 64 28 90 28 128 C28 164 62 176 76 150 C90 124 60 100 45 118 C35 130 38 150 52 152"/><path d="M52 215 C52 238 28 242 27 224 C26 212 42 208 46 220"/></svg>
 <svg id="violin" viewBox="0 0 100 270"><circle cx="50" cy="16" r="9"/><path d="M50 25 L50 125 M44 40 L56 40"/><path d="M50 120 C28 120 20 142 31 156 C38 164 30 170 24 180 C13 200 29 228 50 228 C71 228 87 200 76 180 C70 170 62 164 69 156 C80 142 72 120 50 120Z"/><path d="M38 150 C34 162 38 176 42 182 M62 150 C66 162 62 176 58 182"/><path d="M40 202 L60 202 M46 130 L46 215 M54 130 L54 215"/></svg>
</div>
<div class="staff"></div>
<canvas id="c"></canvas>
<div id="open"><div class="t">Janko 70</div><div class="b">♪ Otvoriť pozvánku</div></div>
<div class="card">
 <div class="pre">Pri príležitosti môjho životného jubilea<br>Vás srdečne pozývam na oslavu</div>
 <div class="big">70</div>
 <div class="sub">narodenín</div>
 <div class="name">Janko</div>
 <div class="line"></div>
 <div class="info">2. januára 2027<br>14:00 hod.<small>V Kaštieli Agátka, Čierna Voda<br><span class="addr">Pezinská 901/5, Chorvátsky Grob</span></small></div>
 <div class="line"></div>
 <div class="thanks">Teším sa na Vás</div>
</div>
<div class="hud"><div id="msg">Klikni na lietajúce noty a balóny ♪ – každé má iný tón</div><button id="again">♫ Zahrať pesničku znova</button></div>

<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d'),W,H,dpr=Math.min(devicePixelRatio||1,1.5);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
resize();addEventListener('resize',resize);

/* audio */
var AC=window.AudioContext||window.webkitAudioContext,ctx=null,master=null;
function init(){if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume()}
function tone(f,t,d,vol){
 var o=ctx.createOscillator(),o2=ctx.createOscillator(),e=ctx.createGain();
 o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;
 e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(vol,t+.02);e.gain.exponentialRampToValueAtTime(.0001,t+d);
 var e2=ctx.createGain();e2.gain.value=.25;o2.connect(e2);e2.connect(e);o.connect(e);e.connect(master);
 o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05)}
var N={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
var mel=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3]];
var started=false,playing=false;
function playSong(){
 init();if(!ctx||ctx.state!=='running'){return false}
 var t=ctx.currentTime+.1,b=.5;playing=true;
 mel.forEach(function(n){tone(N[n[0]],t,n[1]*b*1.4,.35);t+=n[1]*b});
 setTimeout(function(){playing=false},(t-ctx.currentTime)*1000);
 started=true;var m=document.getElementById('msg');if(m&&m.textContent.indexOf('Ťukni')>-1)m.textContent='Klikni na lietajúce noty a balóny ♪ – každé má iný tón';return true}
function tryStart(){if(started)return;try{init();var p=ctx.resume();(p&&p.then?p:Promise.resolve()).then(function(){if(!started)playSong()}).catch(function(){})}catch(e){}}
function firstGesture(){tryStart()}
tryStart();[100,400,900,1600].forEach(function(d){setTimeout(tryStart,d)});
['pointerdown','touchstart','touchend','mousedown','click','keydown','wheel'].forEach(function(ev){document.addEventListener(ev,firstGesture,{passive:true})});
setTimeout(function(){if(!started)document.getElementById('msg').textContent='🔊 Ťukni kamkoľvek – spustí sa Happy Birthday'},1800);

/* notes */
var keys=Object.keys(N),notes=[],parts=[],score=0,last=0;
var TYPES=['tc','e','h','s','hs','b','b2','bal','bal','bal'];
var TREBLE=new Path2D('M52 215 L52 40 C52 8 74 4 74 32 C74 64 28 90 28 128 C28 164 62 176 76 150 C90 124 60 100 45 118 C35 130 38 150 52 152 M52 215 C52 238 28 242 27 224 C26 212 42 208 46 220');
var BODY=new Path2D('M0 -.12 C-.25 -.14 -.62 -.5 -.62 -1.0 C-.62 -1.45 -.3 -1.62 0 -1.62 C.3 -1.62 .62 -1.45 .62 -1.0 C.62 -.5 .25 -.14 0 -.12 Z');
var KNOT=new Path2D('M-.02 -.14 L-.12 .0 L.12 .0 L.02 -.14 Z');
var FLAG=new Path2D('M0 0 C.12 .3 .5 .38 .52 .72 C.53 .88 .45 .98 .36 1.04 C.42 .88 .38 .72 .26 .6 C.16 .5 .06 .44 0 .36 Z');
function spawn(){
 var k=keys[Math.floor(Math.random()*keys.length)],ty=TYPES[Math.floor(Math.random()*TYPES.length)],
 s=30+Math.random()*18,oy=.35,hs=1;
 if(ty==='tc'){s*=1.15;oy=0;hs=1.15}
 else if(ty==='bal'){s*=1.25;oy=.9;hs=.75}
 else if(ty==='b'||ty==='b2'){hs=1.15}
 var n={k:k,f:N[k],x:Math.random()*W,y:H+70,s:s,vy:-(35+Math.random()*45),ph:Math.random()*6.28,amp:20+Math.random()*30,
 t:ty,oy:oy,hs:hs,hue:45,rot:(Math.random()-.5)*(ty==='bal'?.25:.5),x0:0};
 n.x0=n.x;notes.push(n)}
function drawNote(n,t){
 var x=n.x0+Math.sin(t*.0012+n.ph)*n.amp;n.cx=x;
 g.save();g.translate(x,n.y);g.rotate(n.rot+Math.sin(t*.002+n.ph)*.12);
 var s=n.s,ty=n.t,col='#e8c872',sw=s*.06;
 g.fillStyle=col;g.strokeStyle=col;g.lineWidth=sw;g.lineJoin='round';g.lineCap='butt';
 var head=function(ox,oy,hollow){
  g.beginPath();g.ellipse(ox,oy,s*.42,s*.32,-.15,0,6.29);
  if(hollow){g.moveTo(ox+s*.27*Math.cos(-.1),oy+s*.27*Math.sin(-.1));g.ellipse(ox,oy,s*.27,s*.18,-.1,0,6.29);g.fill('evenodd')}
  else g.fill()};
 var sx=function(ox){return ox+s*.38};
 var stem=function(ox,oy,top){g.beginPath();g.moveTo(sx(ox),oy);g.lineTo(sx(ox),top);g.stroke()};
 var flag=function(ox,top){g.save();g.translate(sx(ox)-sw/2,top);g.scale(s,s);g.fill(FLAG);g.restore()};
 var beam=function(x1,y1,x2,y2,th){g.beginPath();g.moveTo(x1-sw/2,y1);g.lineTo(x2+sw/2,y2);g.lineTo(x2+sw/2,y2+th);g.lineTo(x1-sw/2,y1+th);g.closePath();g.fill()};
 if(ty==='h'){head(0,0,true);stem(0,0,-s*1.1)}
 else if(ty==='e'){head(0,0,false);stem(0,0,-s*1.1);flag(0,-s*1.1)}
 else if(ty==='s'){head(0,0,false);stem(0,0,-s*1.15);flag(0,-s*1.15);flag(0,-s*.87)}
 else if(ty==='hs'){head(0,0,true);stem(0,0,-s*1.15);flag(0,-s*1.15);flag(0,-s*.87)}
 else if(ty==='b'||ty==='b2'){var o2=s*1.15;
  head(0,0,false);head(o2,-s*.05,false);stem(0,0,-s*1.05);stem(o2,-s*.05,-s*1.25);
  beam(sx(0),-s*1.05,sx(o2),-s*1.25,s*.17);if(ty==='b2')beam(sx(0),-s*.76,sx(o2),-s*.96,s*.07)}
 else if(ty==='tc'){var k=s*2.2/250;g.scale(k,k);g.translate(-50,-125);g.lineWidth=s*.075/k;g.lineCap='round';g.stroke(TREBLE)}
 else{ /* balón */
  g.save();g.scale(s,s);g.fill(BODY);g.fill(KNOT);g.restore();
  g.lineWidth=Math.max(1.2,s*.03);g.lineCap='round';g.beginPath();g.moveTo(0,0);
  for(var j=1;j<=9;j++)g.lineTo(Math.sin(j*.9+t*.004)*s*.11,j*s*.19);g.stroke()}
 g.restore()}
function boom(x,y,h){
 for(var i=0;i<18;i++){var a=Math.random()*6.28,v=60+Math.random()*230;
 parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,r:1.5+Math.random()*3.5,h:h+Math.random()*25})}
 parts.push({ring:1,x:x,y:y,r:6,l:1,h:h})}
function pop(){
 var t0=ctx.currentTime,len=Math.floor(ctx.sampleRate*.14),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
 for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,6);
 var src=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),e=ctx.createGain();
 src.buffer=buf;hp.type='highpass';hp.frequency.value=500;e.gain.value=1.2;src.connect(hp);hp.connect(e);e.connect(master);src.start(t0);
 var o=ctx.createOscillator(),oe=ctx.createGain();o.type='sine';
 o.frequency.setValueAtTime(260,t0);o.frequency.exponentialRampToValueAtTime(50,t0+.07);
 oe.gain.setValueAtTime(.6,t0);oe.gain.exponentialRampToValueAtTime(.001,t0+.08);
 o.connect(oe);oe.connect(master);o.start(t0);o.stop(t0+.1)}
function hit(px,py){
 init();if(!started)playSong();
 for(var i=notes.length-1;i>=0;i--){var n=notes[i],dx=px-n.cx,dy=py-(n.y-n.s*n.oy);
  if(dx*dx+dy*dy<Math.pow(n.s*.95*n.hs,2)){
   if(ctx&&ctx.state==='running'){if(n.t==='bal')pop();else{tone(n.f,ctx.currentTime,1.1,.5);tone(n.f*2,ctx.currentTime,.4,.12)}}
   boom(n.cx,n.y-n.s*n.oy,n.hue);notes.splice(i,1);score++;
   document.getElementById('msg').textContent=score>=70?'Bravo! 70 zásahov – všetko najlepšie, Janko! 🎻':'Trafené: '+score+' / 70';
   return}}}
cv.addEventListener('pointerdown',function(e){e.preventDefault();hit(e.clientX,e.clientY)});
document.getElementById('again').addEventListener('click',function(){init();if(!playing){started=true;playSong()}});

function loop(t){
 var dt=Math.min((t-(loop.p||t))/1000,.05);loop.p=t;
 g.clearRect(0,0,W,H);
 if(t-last>650&&notes.length<13){spawn();last=t}
 for(var i=notes.length-1;i>=0;i--){var n=notes[i];n.y+=n.vy*dt;if(n.y<-n.s*1.3){notes.splice(i,1);continue}drawNote(n,t)}
 for(i=parts.length-1;i>=0;i--){var p=parts[i];p.l-=dt*(p.ring?1.6:1.3);if(p.l<=0){parts.splice(i,1);continue}
  if(p.ring){p.r+=dt*180;g.strokeStyle='hsla('+p.h+',90%,75%,'+p.l+')';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,p.r,0,6.29);g.stroke();continue}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;g.fillStyle='hsla('+p.h+',90%,72%,'+p.l+')';g.beginPath();g.arc(p.x,p.y,p.r*p.l+.5,0,6.29);g.fill()}
 requestAnimationFrame(loop)}
for(var i=0;i<8;i++){spawn();notes[i].y=H*Math.random()}
requestAnimationFrame(loop);
var ov=document.getElementById('open');
function openInvite(){tryStart();ov.classList.add('gone');setTimeout(function(){ov.style.display='none'},800)}
ov.addEventListener('click',openInvite);
ov.addEventListener('touchend',function(e){e.preventDefault();openInvite()});
})();
</script>
<script>
/* horný text: najväčšia veľkosť, pri ktorej sa riadok zmestí, potom zmenšená koeficientom SCALE */
(function(){
 var e=document.querySelector('.pre');if(!e)return;
 var SCALE=0.88; /* 1 = najväčšie, ktoré sa zmestí; menej = menšie písmo */
 function fit(){
  var max=Math.min(34,window.innerHeight*0.036),fs=max;
  e.style.fontSize=fs+'px';
  while(fs>10&&e.scrollWidth>e.clientWidth+0.5){fs-=0.5;e.style.fontSize=fs+'px'}
 e.style.fontSize=(fs*SCALE)+'px';
 }
 fit();
 window.addEventListener('resize',fit);
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
 setTimeout(fit,400);
})();
</script>
</body>
</html>
